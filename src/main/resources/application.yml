spring:
  mvc:
    async:
      request-timeout: 3600000 # 设置为 1 小时（毫秒）
  profiles:
    active: local
  application:
    name: yu-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: org.maple.aicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn







